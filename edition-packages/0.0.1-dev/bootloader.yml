# ---------------------------------------------------------------------------
# SplashOS "bootloader" edition
#
# A LinuxBoot-style graphical boot manager: a tiny read-only Linux system
# whose init is a GTK4/libadwaita UI (splash-boot-manager) that lists and
# boots other distros/OSes. NO systemd, NO dracut, NO initramfs, NO GRUB.
#
# Boot flow:
#   firmware -> SplashOS kernel (drivers/fs built-in) -> read-only root
#   -> seatd session -> cage (kiosk Wayland compositor)
#   -> splash-boot-manager (GTK4/libadwaita UI)
#      - Linux targets:  kexec -l <kernel> --initrd <...> --command-line <...>; kexec -e
#      - foreign EFI (Windows/macOS): efibootmgr --bootnext <entry>; reboot
#      - rescue tools: fsck, smartctl, lsblk/blkid, dmesg (read-only root)
#
# Kernel prerequisites (the defconfig kernel must be reworked for this):
#   CONFIG_KEXEC=y, DRM/KMS drivers enabled (virtio-gpu etc.),
#   CONFIG_FRAMEBUFFER_CONSOLE=y (also fixes the nomodeset boot hang),
#   storage/filesystem built-ins (already present: virtio, ext4).
#
# parentconfig is molecule (the systemd-free base): distro.yaml is NOT in
# this chain on purpose — this edition must not inherit systemd, dracut or
# GRUB configuration.
#
# STATUS: phase 1 boot core works end-to-end (tested from GRUB: immediate
# default kexec, console menu fallback). Phases 2/3 (GTK4 + libadwaita +
# cage/seatd/wlroots kiosk + splash-boot-manager) are packaged in this file;
# the packages need to be repacked to syspkg from the updated BuildScripts +
# SourceStream definitions before this edition builds end-to-end with the
# graphical UI.
# ---------------------------------------------------------------------------

parentconfig: molecule

packages:
    # ---- phase 1: non-graphic boot core -----------------------------------
    # udev without systemd (LFS' udev comes from systemd's source tree)
    # NOTE: eudev BuildScripts package still missing — added when packaged.
    # - package: "eudev"
    #   version: "3.2.14"
    - package: "kexec_tools"
      version: "2.0.29"
    - package: "efivar"
      version: "39"
    - package: "popt"
      version: "1.19"
    - package: "efibootmgr"
      version: "18"
    - package: "smartmontools"
      version: "7.5"

    # ---- phase 2: GTK4 + libadwaita stack ----------------------------------
    # Dependency order is expressed in the build list below.
    - package: "libpng"
      version: "1.6.47"
    - package: "glib"
      version: "2.84.4"
    - package: "libxml2"
      version: "2.13.6"
    - package: "freetype"
      version: "2.13.3"
    - package: "fribidi"
      version: "1.0.16"
    - package: "harfbuzz"
      version: "10.4.0"
    - package: "fontconfig"
      version: "2.15.0"
    - package: "pixman"
      version: "0.44.2"
    - package: "cairo"
      version: "1.18.4"
    - package: "graphene"
      version: "1.10.8"
    - package: "gdk_pixbuf"
      version: "2.42.12"
    - package: "pango"
      version: "1.56.3"
    - package: "libdrm"
      version: "2.4.125"
    - package: "wayland"
      version: "1.23.1"
    - package: "wayland_protocols"
      version: "1.41"
    - package: "libxkbcommon"
      version: "1.8.1"
    - package: "xkeyboard_config"
      version: "2.44"

    # gtk4 requires epoxy, libjpeg and libtiff unconditionally (no
    # required: false on those dependency() calls). jpeg 9f and tiff 4.4.0
    # are the last non-cmake releases - the chroot has no cmake. libepoxy
    # only vendors the Khronos registry XML (for codegen), not the compile
    # headers: EGL/eglplatform.h comes from mesa's egl.pc, so mako + mesa
    # build before it (mesa's codegen also needs the mako python module).
    - package: "jpeg"
      version: "9f"
    - package: "tiff"
      version: "4.4.0"
    - package: "mako"
      version: "1.3.9"
    - package: "pyyaml"
      version: "6.0.2"
    - package: "mesa"
      version: "25.0.1"
    - package: "libepoxy"
      version: "1.5.10"

    - package: "gtk4"
      version: "4.16.12"

    # libadwaita compiles its stylesheet with the sassc CLI at build time
    # (no prebuilt css in the tarball, and meson's wrap fallback needs
    # git/network); sassc links the libsass library.
    - package: "libsass"
      version: "3.6.5"
    - package: "sassc"
      version: "3.6.2"

    # libadwaita 1.5 requires appstream unconditionally (About-window
    # metadata); appstream needs libyaml, libxmlb and libcurl.
    - package: "libyaml"
      version: "0.2.5"
    - package: "libxmlb"
      version: "0.3.21"
    - package: "curl"
      version: "8.18.0"
    - package: "appstream"
      version: "1.0.4"

    - package: "libadwaita"
      version: "1.5.6"

    # ---- phase 3: kiosk session + custom app -------------------------------
    - package: "libevdev"
      version: "1.13.4"
    - package: "mtdev"
      version: "1.1.7"
    - package: "eudev"
      version: "3.2.14"
    - package: "libinput"
      version: "1.27.1"
    - package: "seatd"
      version: "0.9.1"
    - package: "libliftoff"
      version: "0.5.0"

    # wlroots' DRM backend requires the hwdata pkg-config file (to locate
    # pnp.ids) and libdisplay-info (EDID parsing; its git-wrap fallback
    # can't work in the chroot).
    - package: "hwdata"
      version: "0.390"
    - package: "libdisplay-info"
      version: "0.2.0"

    - package: "wlroots"
      version: "0.18.2"
    - package: "cage"
      version: "0.2.0"
    - package: "splash_boot_manager"
      version: "0.1.8"

    # The picker UI needs at least one font: Pango/GTK 4.16 compute
    # garbage window geometry from a label layout with an empty
    # fontconfig and GDK aborts at the first frame.
    - package: "dejavu_fonts"
      version: "2.37"

    # ---- toolchain: rust for splash-boot-manager (phase 3, Rust/GTK4) -----
    # Bootstrap install of pre-built rustc/cargo binaries (no compilation).
    - package: "rust"
      version: "1.100.0"

    # ---- phase 2: GTK4 + libadwaita stack (packaged - see BuildScripts) ----
    # glib, pango, cairo, harfbuzz, fribidi, gdk_pixbuf, graphene,
    # fontconfig, freetype, libxml2, wayland, wayland_protocols, libxkbcommon
    # (+ xkeyboard_config data, libpng)

    # ---- phase 3: kiosk session + custom app (packaged) ---------------------
    # mesa (softpipe software GL - no LLVM), libevdev, mtdev, eudev (libudev
    # for libinput), libinput, seatd, libliftoff, wlroots, cage,
    # splash_boot-manager (SplashBootManager repo, vendored crates)

build:
    # Phase 1: tools that need the chroot toolchain only. Built AFTER the
    # molecule base, inside the chroot. The rust toolchain installs first
    # (bootstrap binaries, no compilation) so phase 3 can build the UI.
    - task: change_enviroment
      enviroment: chroot
      build:
        - task: compile
          package: rust
          buildmode: 1

        - task: compile
          package: kexec_tools
          buildmode: 1

        - task: compile
          package: efivar
          buildmode: 1

        - task: compile
          package: popt
          buildmode: 1

        - task: compile
          package: efibootmgr
          buildmode: 1

        - task: compile
          package: smartmontools
          buildmode: 1

        # superkey - evdev probe for "is a Super (Windows) key held?". Used
        # by /sbin/init at power-on: Super held -> boot options menu,
        # Super not held -> kexec the default BLS entry immediately. Reads
        # the current key state (EVIOCGKEY), not the event stream, so it
        # works no matter when the key was pressed. EVIOCGKEY is an ioctl,
        # which bash cannot do, hence this tiny helper. Kernel input
        # headers come from the linux-headers build (buildmode 1).
        # Paths are $splash_partition_root-prefixed so the same task text
        # also works host-side (SplashBootManager/install-test-entries.sh
        # evals it to reinstall boot tools without a rebuild).
        - task: custom
          commands:
           - |
            echo "Building the superkey boot probe..."
            mkdir -p "$splash_partition_root/usr/src"
            cat > "$splash_partition_root/usr/src/superkey.c" << "EOF"
            /* superkey - exit 0 when a Super (Windows) key is currently held,
             * exit 1 when it is not (or no input devices exist). */
            #include <dirent.h>
            #include <fcntl.h>
            #include <limits.h>
            #include <stdio.h>
            #include <string.h>
            #include <sys/ioctl.h>
            #include <unistd.h>
            #include <linux/input.h>
            #include <linux/input-event-codes.h>

            int main(void)
            {
                DIR *dir = opendir("/dev/input");
                if (!dir) {
                    perror("superkey: /dev/input");
                    return 1;
                }

                struct dirent *d;
                while ((d = readdir(dir)) != NULL) {
                    if (strncmp(d->d_name, "event", 5) != 0)
                        continue;

                    char path[PATH_MAX];
                    snprintf(path, sizeof(path), "/dev/input/%s", d->d_name);

                    int fd = open(path, O_RDONLY | O_NONBLOCK);
                    if (fd < 0)
                        continue;

                    unsigned char keybits[(KEY_MAX / 8) + 1] = { 0 };
                    if (ioctl(fd, EVIOCGKEY(sizeof(keybits)), keybits) >= 0) {
                        int left = keybits[KEY_LEFTMETA / 8] & (1 << (KEY_LEFTMETA % 8));
                        int right = keybits[KEY_RIGHTMETA / 8] & (1 << (KEY_RIGHTMETA % 8));
                        if (left || right) {
                            printf("superkey: %s: Super key held\n", path);
                            close(fd);
                            closedir(dir);
                            return 0;
                        }
                    }
                    close(fd);
                }
                closedir(dir);
                return 1;
            }
            EOF
            gcc -O2 -I"$splash_partition_root/usr/include" -o "$splash_partition_root/usr/bin/superkey" "$splash_partition_root/usr/src/superkey.c"
            rm -f "$splash_partition_root/usr/src/superkey.c"
            ls -v -l "$splash_partition_root/usr/bin/superkey"

        # ---- phase 2: GTK4 + libadwaita stack --------------------------------
        # Dependency order. Everything builds in the chroot with the target
        # toolchain; pkg-config resolves the stack incrementally.
        - task: compile
          package: libpng
          buildmode: 1

        - task: compile
          package: glib
          buildmode: 1

        - task: compile
          package: libxml2
          buildmode: 1

        - task: compile
          package: freetype
          buildmode: 1

        - task: compile
          package: fribidi
          buildmode: 1

        - task: compile
          package: harfbuzz
          buildmode: 1

        - task: compile
          package: fontconfig
          buildmode: 1

        - task: compile
          package: pixman
          buildmode: 1

        - task: compile
          package: cairo
          buildmode: 1

        - task: compile
          package: graphene
          buildmode: 1

        - task: compile
          package: gdk_pixbuf
          buildmode: 1

        - task: compile
          package: pango
          buildmode: 1

        - task: compile
          package: libdrm
          buildmode: 1

        - task: compile
          package: wayland
          buildmode: 1

        - task: compile
          package: wayland_protocols
          buildmode: 1

        - task: compile
          package: libxkbcommon
          buildmode: 1

        - task: compile
          package: xkeyboard_config
          buildmode: 1

        # gtk4 requires epoxy, libjpeg and libtiff unconditionally (no
        # required:false on those dependency() calls); jpeg/tiff are the
        # non-cmake releases (the chroot has no cmake). libepoxy only
        # vendors the Khronos registry XML, not the compile headers:
        # EGL/eglplatform.h comes from mesa's egl.pc, so mako + mesa
        # build before it (mesa's codegen also needs the mako module).
        - task: compile
          package: jpeg
          buildmode: 1

        - task: compile
          package: tiff
          buildmode: 1

        # mesa uses the LLVM-free softpipe driver for software GL; its
        # meson setup hard-requires the PyYAML python module.
        - task: compile
          package: mako
          buildmode: 1

        - task: compile
          package: pyyaml
          buildmode: 1

        - task: compile
          package: mesa
          buildmode: 1

        - task: compile
          package: libepoxy
          buildmode: 1

        - task: compile
          package: gtk4
          buildmode: 1

        # libadwaita compiles its stylesheet with the sassc CLI at build
        # time (no prebuilt css in the tarball; meson's wrap fallback
        # needs git/network). sassc links the libsass library.
        - task: compile
          package: libsass
          buildmode: 1

        - task: compile
          package: sassc
          buildmode: 1

        # libadwaita 1.5 requires appstream unconditionally (About-window
        # metadata); appstream needs libyaml, libxmlb and libcurl.
        - task: compile
          package: libyaml
          buildmode: 1

        - task: compile
          package: libxmlb
          buildmode: 1

        - task: compile
          package: curl
          buildmode: 1

        - task: compile
          package: appstream
          buildmode: 1

        - task: compile
          package: libadwaita
          buildmode: 1

        # ---- phase 3: kiosk session + graphical boot manager ------------------
        - task: compile
          package: libevdev
          buildmode: 1

        - task: compile
          package: mtdev
          buildmode: 1

        - task: compile
          package: eudev
          buildmode: 1

        - task: compile
          package: libinput
          buildmode: 1

        - task: compile
          package: seatd
          buildmode: 1

        - task: compile
          package: libliftoff
          buildmode: 1

        # wlroots' DRM backend requires hwdata (pnp.ids via pkg-config)
        # and libdisplay-info (EDID parsing).
        - task: compile
          package: hwdata
          buildmode: 1

        - task: compile
          package: libdisplay-info
          buildmode: 1

        - task: compile
          package: wlroots
          buildmode: 1

        - task: compile
          package: cage
          buildmode: 1

        - task: compile
          package: splash_boot_manager
          buildmode: 1

        # The picker UI needs at least one font: Pango/GTK compute garbage
        # window geometry with an empty fontconfig and abort at the first
        # frame. Appended last so the chroot compile anchors of the
        # existing packages (eudev=40 .. splash_boot_manager=48) are
        # unchanged; the font lands at anchor 49.
        - task: compile
          package: dejavu_fonts
          buildmode: 1

    # Phase 1 host-side: dev boot core for the boot manager itself. The
    # kernel boots root=<this partition> ro; no initramfs, no GRUB on the
    # target (the manager IS the menu).
    #
    # Boot flow:
    #   1. mount the virtual filesystems (devtmpfs is auto-mounted by the
    #      kernel, CONFIG_DEVTMPFS_MOUNT)
    #   2. scan /loader/entries/*.conf + loader.conf (BLS type 1)
    #   3. probe the Super key with /usr/bin/superkey (EVIOCGKEY state, no
    #      timing race):
    #        - Super NOT held: kexec the default entry IMMEDIATELY - no
    #          countdown, the graphical stack never starts
    #        - Super held: play the splash animation, then open the boot
    #          options UI (splash-boot-manager under cage via seatd), a
    #          console fallback menu if the graphical stack is missing.
    #          splash-boot-manager is launched with --splash: animated logo
    #          first, then the Apple-style disc picker - the user picks,
    #          kexec runs.
    # The packaged manager eventually replaces this init entirely.
    #
    # Entry DATA (loader/entries/*.conf for the OSes installed on a specific
    # machine) is machine-specific and is NOT written here - it is installed
    # after the build by SplashBootManager/install-test-entries.sh.
    - task: custom
      commands:
       - |
        echo "Phase 1 boot core: installing dev init..."
        install -v -m755 -d "$splash_partition_root/sbin"
        cat > "$splash_partition_root/sbin/init" << "EOF"
        #!/bin/bash
        # splash-boot-manager: phase 1 dev init (placeholder).
        # See the bootloader edition config for the boot flow; the packaged
        # graphical manager replaces this file.
        mount -t proc proc /proc 2>/dev/null
        mount -t sysfs sysfs /sys 2>/dev/null
        mountpoint -q /dev || mount -t devtmpfs devtmpfs /dev 2>/dev/null

        # The boot-manager root is mounted 'ro' (kernel cmdline) - a
        # read-only boot manager is by design. Runtime state needs a
        # writable /run though: seatd/udevd bind their sockets there and
        # the compositor's XDG_RUNTIME_DIR lives there. On the read-only
        # root those bind() calls would fail with EROFS (the daemons
        # silently die), so mount /run as tmpfs.
        mountpoint -q /run || mount -t tmpfs -o mode=0755,nosuid,nodev tmpfs /run

        # /dev/shm: devtmpfs does NOT provide it - it must be mounted
        # separately. wlroots' linux-dmabuf format table and keyboard
        # keymaps use shm_open (POSIX shared memory = /dev/shm), as do
        # GTK clients; without the mount every shm_open fails and cage
        # aborts with "Failed to allocate shm file for format table".
        mkdir -p /dev/shm
        mountpoint -q /dev/shm || mount -t tmpfs -o mode=1777,nosuid,nodev tmpfs /dev/shm

        # ---- console ownership --------------------------------------------
        # Nothing may paint over the splash logo, so keep the init silent:
        # progress goes to /run/boot.log (tmpfs - the root is read-only) and
        # fbcon is unbound for the whole animated phase. Kernel noise is
        # already suppressed by the boot entry's 'quiet'.
        # NOTE: the player's own unbind targets vtcon1, which is the *dummy*
        # console on this kernel (vtcon0 is fbcon), so hide it here as well.
        # The console comes back whenever a console UI (menu, rescue shell)
        # is needed.
        log() { printf '%s\n' "$*" >>/run/boot.log 2>/dev/null; }

        console_owner() {   # $1 = 0 hide fbcon, 1 take the console back
            local v
            for v in /sys/class/vtconsole/vtcon*; do
                case "$(cat "$v/name" 2>/dev/null)" in
                    *"frame buffer"*) echo "$1" > "$v/bind" 2>/dev/null ;;
                esac
            done
        }

        console_restore() {
            console_owner 1
            # fbcon redraws the VT buffer on bind; it was cleared before the
            # unbind, so drop anything left over and start the fallback UI
            # from a clean screen.
            printf '\033[H\033[2J' >/dev/tty1 2>/dev/null
        }

        # ---- BLS boot tree ------------------------------------------------
        shopt -s nullglob
        entries=(/loader/entries/*.conf)
        shopt -u nullglob
        if [ ${#entries[@]} -eq 0 ]; then
            echo "  No BLS entries under /loader/entries, dropping to a rescue shell."
            exec /bin/bash
        fi

        # loader.conf: default entry id (BLS glob-style, trailing * allowed)
        # and menu timeout in seconds (only used by the graphical UI).
        default=""
        timeout=5
        if [ -r /loader/loader.conf ]; then
            while read -r key value; do
                case "$key" in
                    default) default="${value%\*}" ;;
                    timeout) timeout="$value" ;;
                esac
            done < /loader/loader.conf
        fi

        # BLS type 1: "key value" per line (matches src/bls.rs; only the
        # first initrd is used by this placeholder).
        parse_entry() {
            entry_title=""
            entry_kernel=""
            entry_initrd=""
            entry_options=""
            while read -r key value; do
                case "$key" in
                    title)   entry_title="$value" ;;
                    linux)   entry_kernel="$value" ;;
                    initrd)  entry_initrd="$value" ;;
                    options) entry_options="$entry_options $value" ;;
                esac
            done < "$1"
        }

        kexec_entry() {
            # $1 = entry file; $2 = "logo" to blit the static splash frame
            # over the console AFTER the (slow) kexec -l load and just
            # before kexec -e - the screen keeps the frame until the new
            # kernel reinitializes the display. Blitting before kexec -l
            # only covers the logo with the loader's own output.
            # When the splash animation player is still running ($anim_pid,
            # set before the superkey probe) the screen is already covered:
            # skip the one-frame blit and let the player keep painting
            # during the kexec -l load, then freeze it on its last frame
            # right before kexec -e.
            parse_entry "$1"
            local id cmdline kexec_args
            id="$(basename "$1" .conf)"
            cmdline="${entry_options# }"
            log "Booting \"${entry_title:-$id}\" ($id)"
            log "  kernel:   $entry_kernel"
            [ -n "$entry_initrd" ] && log "    initrd:   $entry_initrd"
            [ -n "$cmdline" ] && log "    cmdline:  $cmdline"
            kexec_args=(kexec -l "$entry_kernel" --command-line="$cmdline")
            [ -n "$entry_initrd" ] && kexec_args+=(--initrd="$entry_initrd")
            if ! "${kexec_args[@]}" >>/run/boot.log 2>&1; then
                console_restore
                echo "  kexec -l failed for \"${entry_title:-$id}\" (details: /run/boot.log)."
                return 1
            fi
            if [ "$2" = "logo" ] && [ -z "$anim_pid" ] \
               && [ -x /usr/bin/splash-logo ] \
               && [ -r /usr/share/splashos/boot-logo.raw ]; then
                SPLASH_ONCE=1 /usr/bin/splash-logo || true
            fi
            # Let the animation play out (hold the last frame) before the
            # kexec handoff - a frozen mid-animation frame looks broken.
            [ -n "$anim_pid" ] && wait "$anim_pid" 2>/dev/null
            kexec -e
            console_restore
            echo "  kexec failed, dropping to a rescue shell."
            return 1
        }

        # Default entry pick: exact id first, then id prefix (mirrors
        # src/bls.rs default_entry), otherwise the first entry.
        pick_default() {
            local pass e id
            for pass in exact prefix; do
                for e in "${entries[@]}"; do
                    id="$(basename "$e" .conf)"
                    if [ "$pass" = exact ] && [ "$id" = "$default" ]; then
                        printf '%s' "$e"
                        return 0
                    elif [ "$pass" = prefix ]; then
                        case "$id" in
                            "$default"*) printf '%s' "$e"; return 0 ;;
                        esac
                    fi
                done
            done
            printf '%s' "${entries[0]}"
        }

        # ---- boot options menu (Super key was held) ------------------------
        # superkey probes the *current* key state of /dev/input/event*.
        # USB HID keyboards enumerate ~1s into the boot, and a Super held
        # since power-on must still be DOWN in the evdev state when
        # superkey reads it. Probe in a bounded loop: check every 100ms
        # for up to 2s, exiting as soon as the key is detected. PS/2
        # keyboards register instantly and are detected on the first
        # probe; the added default-boot cost is the tail of the window.
        #
        # The splash animation plays while the boot manager is loading:
        # splash-logo blits the raw asset's frames once (the console is
        # unbound, so nothing prints over it) and the LAST frame stays up
        # until either the UI takes over or kexec replaces the screen.
        # Apple-style: animation -> options UI.
        anim_pid=""
        if [ -x /usr/bin/splash-logo ] && [ -r /usr/share/splashos/boot-logo.raw ]; then
            # empty the VT buffer while it is still drawable, then detach
            # fbcon: from here on nothing the manager writes reaches the
            # screen and kernel messages (loglevel <= 3) cannot repaint it
            printf '\033[H\033[2J' >/dev/tty1 2>/dev/null
            console_owner 0
            /usr/bin/splash-logo &
            anim_pid=$!
        fi

        sk_status=1
        probe_tick=0
        while [ "$probe_tick" -lt 20 ]; do
            if [ -x /usr/bin/superkey ] && /usr/bin/superkey >/dev/null 2>&1; then
                sk_status=0
                break
            fi
            sleep 0.1
            probe_tick=$((probe_tick + 1))
        done
        if [ "$sk_status" -eq 0 ]; then
            # Let the animation play out (hold the last frame) before the
            # UI starts - Apple-style: animation -> options UI.
            [ -n "$anim_pid" ] && wait "$anim_pid" 2>/dev/null
            log "Super key held - boot options"

            # Graphical UI (phase-3 stack): seatd session -> cage (kiosk
            # Wayland) -> splash-boot-manager --menu. The splash animation
            # already played on the framebuffer while the boot manager was
            # loading; the UI opens as the Apple-style disc picker.
            # --boot-dir /: BLS lives in /loader on this partition.
            # Falls back to the console menu on failure.
            if [ -x /usr/bin/splash-boot-manager ] && [ -x /usr/bin/cage ] \
               && [ -x /usr/bin/seatd ]; then
                log "Starting the graphical boot options UI..."
                mkdir -p /run
                export XDG_RUNTIME_DIR=/run
                # kexec lives in /usr/sbin; without a PATH the app's
                # execvp falls back to /bin:/usr/bin and the disc picker
                # reports 'failed to spawn kexec: No such file or
                # directory'.
                export PATH=/usr/sbin:/usr/bin:/sbin:/bin
                # GSK_RENDERER=cairo: the cairo renderer is the only working
                # one - the client's own EGL on the render node needs the
                # 'virtio' DRI driver (not built; the kms_swrast fallback
                # inside the wayland platform also probes virtio and dies).
                # The wl_shm pool abort from the previous round was the
                # garbage window size of the fullscreen() racing cage's
                # configure - the app no longer requests fullscreen itself.
                export GSK_RENDERER=cairo
                export GSETTINGS_BACKEND=memory
                # GTK warns (and slows down) without a machine id.
                [ -e /etc/machine-id ] || : > /etc/machine-id
                # NOTE: do NOT export WAYLAND_DISPLAY here - wlroots'
                # backend autocreation sees it and tries to CONNECT to a
                # parent compositor (wayland backend) instead of driving
                # the DRM device directly, which fails with "Could not
                # connect to remote display". Clients default to the
                # wayland-0 socket that cage creates anyway.
                # libinput enumerates input devices through the udev
                # database: run eudev's udevd before the compositor.
                # eudev installs udevd to /usr/sbin, not /usr/lib/udev.
                if [ -x /usr/sbin/udevd ]; then
                    /usr/sbin/udevd --daemon
                    udevadm trigger --action=add --type=devices 2>/dev/null
                    udevadm settle 2>/dev/null || true
                    # Diagnostics: libinput enumerates input devices from
                    # the udev database (/run/udev/data) - zero records
                    # there means cage starts with no keyboard and the
                    # wlroots no-input-devices check aborts the backend.
                    udev_records=$(ls /run/udev/data 2>/dev/null | wc -l)
                    log "udev: $udev_records device records in /run/udev/data"
                    if [ "$udev_records" -eq 0 ]; then
                        log "udev: retrying trigger/settle..."
                        udevadm trigger --action=add 2>/dev/null
                        udevadm settle 2>/dev/null || true
                        udev_records=$(ls /run/udev/data 2>/dev/null | wc -l)
                        log "udev: $udev_records records after retry"
                    fi
                fi
                seatd -g root >/run/seatd.log 2>&1 &
                seatd_pid=$!
                sleep 1
                # Foreground cage (no -d): its diagnostics print to the
                # console instead of vanishing with the daemon.
                # WAYLAND_DEBUG=1: libwayland's built-in protocol trace -
                # it is compiled into every libwayland, unlike GDK_DEBUG
                # which is compiled out of our release-build GTK. The
                # trace shows the exact xdg configure size cage sends
                # and the exact wl_shm create_buffer dimensions GTK
                # uses; a garbage size there makes GDK abort (ftruncate
                # EINVAL / Cairo 'invalid value (typically too big)').
                WAYLAND_DEBUG=1 cage -- /usr/bin/splash-boot-manager --menu --boot-dir / 2>/run/gbm.err
                gui_status=$?
                # cage owned the DRM output while it ran: take the console
                # back before the fallback menu (and its diagnostics) print.
                console_restore
                # Print the interesting protocol lines: every xdg
                # configure (with its size), every shm buffer creation
                # (with its dimensions), every scale event, plus the
                # app's stderr. The full trace is in /run/gbm.err.
                echo "  --- wayland protocol trace (tail) ---"
                grep -aE "configure|create_buffer|\.scale\(|preferred_scale" /run/gbm.err | tail -20
                echo "  --- app stderr (tail) ---"
                tail -8 /run/gbm.err
                echo "  --- end trace ---"
                echo "  Graphical UI exited (status $gui_status) , falling back to the console menu."
                echo
                kill -TERM "$seatd_pid" 2>/dev/null
            fi

            # The console menu below needs fbcon: restore it (idempotent -
            # the graphical path already did this before its diagnostics).
            console_restore
            echo "  Boot options:"
            echo
            local_menu=()
            for e in "${entries[@]}"; do
                parse_entry "$e"
                local_menu+=("$e")
            done
            n=0
            for e in "${local_menu[@]}"; do
                n=$((n+1))
                parse_entry "$e"
                printf "  [%d] %s\n" "$n" "${entry_title:-$(basename "$e" .conf)}"
            done
            echo
            printf "  Boot entry number [1-%d]: " "$n"
            if read -r choice && [ "$choice" -ge 1 ] 2>/dev/null \
               && [ "$choice" -le "$n" ] 2>/dev/null; then
                :
            else
                choice=1
            fi
            kexec_entry "${local_menu[$((choice-1))]}"
            echo
            exec /bin/bash
        else
            # Diagnostic: 1 = key simply not held at probe time, other
            # non-zero values point at a superkey probe error.
            log "superkey: probe exit $sk_status (1 = not held)"
        fi

        # ---- default boot: IMMEDIATELY, no timeout -------------------------
        entry="$(pick_default)"
        id="$(basename "$entry" .conf)"
        log "Booting the default entry \"$id\" (hold Super at power-on for boot options)"
        # kexec -l loads first (its output and the blit order matter: the
        # static splash frame must land AFTER the last console text and
        # just before kexec -e replaces the screen). The animated GIF
        # plays in the graphical UI and later plymouth.
        kexec_entry "$entry" logo
        echo
        exec /bin/bash
        EOF
        chmod -v 755 "$splash_partition_root/sbin/init"
        # Distinguish the boot-manager install from a regular molecule system
        sed -i 's/^VARIANT=.*/VARIANT="Splash Boot Manager"/; s/^VARIANT_ID=.*/VARIANT_ID="boot-manager"/' "$splash_partition_root/etc/os-release"
