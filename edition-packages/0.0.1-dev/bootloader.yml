# ---------------------------------------------------------------------------
# SplashOS "bootloader" edition
#
# A LinuxBoot-style graphical boot manager: a tiny read-only Linux system
# whose init is a GTK4/libadwaita UI (splash-boot-manager) that lists and
# boots other distros/OSes. NO systemd, NO dracut, NO initramfs, NO GRUB.
#
# Boot flow:
#   firmware -> SplashOS kernel (drivers/fs built-in) -> read-only root
#   -> seatd session -> cage (kiosk Wayland compositor)
#   -> splash-boot-manager (GTK4/libadwaita UI)
#      - Linux targets:  kexec -l <kernel> --initrd <...> --command-line <...>; kexec -e
#      - foreign EFI (Windows/macOS): efibootmgr --bootnext <entry>; reboot
#      - rescue tools: fsck, smartctl, lsblk/blkid, dmesg (read-only root)
#
# Kernel prerequisites (the defconfig kernel must be reworked for this):
#   CONFIG_KEXEC=y, DRM/KMS drivers enabled (virtio-gpu etc.),
#   CONFIG_FRAMEBUFFER_CONSOLE=y (also fixes the nomodeset boot hang),
#   storage/filesystem built-ins (already present: virtio, ext4).
#
# parentconfig is molecule (the systemd-free base): distro.yaml is NOT in
# this chain on purpose — this edition must not inherit systemd, dracut or
# GRUB configuration.
#
# STATUS: phase 1 — the graphical stack (phases 2/3) is not packaged yet.
# /sbin/init is a non-graphic dev placeholder (VFS + BLS pick + kexec) so the
# built partition is bootable and the kexec path can be tested from GRUB.
# ---------------------------------------------------------------------------

parentconfig: molecule

packages:
    # ---- phase 1: non-graphic boot core -----------------------------------
    # udev without systemd (LFS' udev comes from systemd's source tree)
    # NOTE: eudev BuildScripts package still missing — added when packaged.
    # - package: "eudev"
    #   version: "3.2.14"
    - package: "kexec_tools"
      version: "2.0.29"
    - package: "efivar"
      version: "39"
    - package: "popt"
      version: "1.19"
    - package: "efibootmgr"
      version: "18"
    - package: "smartmontools"
      version: "7.5"

    # ---- toolchain: rust for splash-boot-manager (phase 3, Rust/GTK4) -----
    # Bootstrap install of pre-built rustc/cargo binaries (no compilation).
    - package: "rust"
      version: "1.100.0"

    # ---- phase 2: GTK4 + libadwaita stack (not packaged yet) ---------------
    # glib, pango, cairo, harfbuzz, fribidi, gdk_pixbuf, graphene,
    # fontconfig, freetype, libxml2, itstool? gtk4, libadwaita (+sassc),
    # wayland, wayland_protocols, libxkbcommon

    # ---- phase 3: kiosk session + custom app (not packaged yet) ------------
    # mesa (llvmpipe GL), libinput, seatd, pixman, libliftoff, wlroots,
    # cage, splash-boot-manager (new SplashOS source repo)

build:
    # Phase 1: tools that need the chroot toolchain only. Built AFTER the
    # molecule base, inside the chroot. The rust toolchain installs first
    # (bootstrap binaries, no compilation) so phase 3 can build the UI.
    - task: change_enviroment
      enviroment: chroot
      build:
        - task: compile
          package: rust
          buildmode: 1

        - task: compile
          package: kexec_tools
          buildmode: 1

        - task: compile
          package: efivar
          buildmode: 1

        - task: compile
          package: popt
          buildmode: 1

        - task: compile
          package: efibootmgr
          buildmode: 1

        - task: compile
          package: smartmontools
          buildmode: 1

    # Phase 1 host-side: non-graphic dev boot core for the boot manager
    # itself. The kernel boots root=<this partition> ro; no initramfs, no GRUB
    # on the target (the manager IS the menu).
    #
    # The graphical manager (GTK4/libadwaita, SplashBootManager repo) is not
    # packaged yet, so /sbin/init is a phase-1 placeholder that does the
    # non-graphic part of the boot flow: mount the virtual filesystems, pick
    # the default BLS entry (loader.conf default/timeout) and kexec it, with
    # a rescue shell fallback. The packaged manager replaces this file
    # (init=<manager binary>).
    #
    # Entry DATA (loader/entries/*.conf for the OSes installed on a specific
    # machine) is machine-specific and is NOT written here — it is installed
    # after the build by SplashBootManager/install-test-entries.sh.
    - task: custom
      commands:
       - |
        echo "Phase 1 boot core: installing dev init (graphical UI pending)..."
        install -v -m755 -d "$splash_partition_root/sbin"
        cat > "$splash_partition_root/sbin/init" << "EOF"
        #!/bin/bash
        # splash-boot-manager: phase 1 dev init (placeholder).
        # The graphical manager (SplashBootManager repo) is not packaged yet;
        # this is the non-graphic boot core so the boot-manager partition is
        # actually testable. The packaged manager replaces this file.
        mount -t proc proc /proc 2>/dev/null
        mount -t sysfs sysfs /sys 2>/dev/null
        mountpoint -q /dev || mount -t devtmpfs devtmpfs /dev 2>/dev/null

        echo
        echo "  Splash Boot Manager - phase 1 (dev init, graphical UI pending)"
        echo

        shopt -s nullglob
        entries=(/loader/entries/*.conf)
        shopt -u nullglob
        if [ ${#entries[@]} -eq 0 ]; then
            echo "  No BLS entries under /loader/entries, dropping to a rescue shell."
            exec /bin/bash
        fi

        # loader.conf: default entry id (BLS glob-style, trailing * allowed)
        # and menu timeout in seconds.
        default=""
        timeout=5
        if [ -r /loader/loader.conf ]; then
            while read -r key value; do
                case "$key" in
                    default) default="${value%\*}" ;;
                    timeout) timeout="$value" ;;
                esac
            done < /loader/loader.conf
        fi

        # Pick the default entry: exact id first, then id prefix (mirrors
        # src/bls.rs default_entry: exact / ends_with / starts_with),
        # otherwise the first entry.
        entry=""
        for pass in exact prefix; do
            for e in "${entries[@]}"; do
                id="$(basename "$e" .conf)"
                if [ "$pass" = exact ] && [ "$id" = "$default" ]; then
                    entry="$e"
                    break 2
                elif [ "$pass" = prefix ]; then
                    case "$id" in
                        "$default"*) entry="$e"; break 2 ;;
                    esac
                fi
            done
        done
        [ -n "$entry" ] || entry="${entries[0]}"

        # BLS type 1: "key value" per line (matches src/bls.rs; only the
        # first initrd is used by this placeholder).
        title=""
        kernel=""
        initrd=""
        options=""
        while read -r key value; do
            case "$key" in
                title)   title="$value" ;;
                linux)   kernel="$value" ;;
                initrd)  initrd="$value" ;;
                options) options="$options $value" ;;
            esac
        done < "$entry"

        id="$(basename "$entry" .conf)"
        echo "  Default entry: ${title:-$id} ($id)"
        echo "    kernel:   $kernel"
        [ -n "$initrd" ] && echo "    initrd:   $initrd"
        [ -n "$options" ] && echo "    cmdline:  ${options# }"
        echo
        printf "  Booting in %ss - press Enter for a rescue shell... " "$timeout"
        if read -t "$timeout" -r; then
            echo
            exec /bin/bash
        fi
        echo
        echo

        [ -n "$options" ] && cmdline="${options# }" || cmdline=""
        kexec_args=(kexec -l "$kernel" --command-line="$cmdline")
        [ -n "$initrd" ] && kexec_args+=(--initrd="$initrd")

        if ! "${kexec_args[@]}"; then
            echo "  kexec -l failed, dropping to a rescue shell."
            exec /bin/bash
        fi
        kexec -e
        echo "  kexec failed, dropping to a rescue shell."
        exec /bin/bash
        EOF
        chmod -v 755 "$splash_partition_root/sbin/init"
        # Distinguish the boot-manager install from a regular molecule system
        sed -i 's/^VARIANT=.*/VARIANT="Splash Boot Manager"/; s/^VARIANT_ID=.*/VARIANT_ID="boot-manager"/' "$splash_partition_root/etc/os-release"
