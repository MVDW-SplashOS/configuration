# ---------------------------------------------------------------------------
# SplashOS "bootloader" edition
#
# A LinuxBoot-style graphical boot manager: a tiny read-only Linux system
# whose init is a GTK4/libadwaita UI (splash-boot-manager) that lists and
# boots other distros/OSes. NO systemd, NO dracut, NO initramfs, NO GRUB.
#
# Boot flow:
#   firmware -> SplashOS kernel (drivers/fs built-in) -> read-only root
#   -> seatd session -> cage (kiosk Wayland compositor)
#   -> splash-boot-manager (GTK4/libadwaita UI)
#      - Linux targets:  kexec -l <kernel> --initrd <...> --command-line <...>; kexec -e
#      - foreign EFI (Windows/macOS): efibootmgr --bootnext <entry>; reboot
#      - rescue tools: fsck, smartctl, lsblk/blkid, dmesg (read-only root)
#
# Kernel prerequisites (the defconfig kernel must be reworked for this):
#   CONFIG_KEXEC=y, DRM/KMS drivers enabled (virtio-gpu etc.),
#   CONFIG_FRAMEBUFFER_CONSOLE=y (also fixes the nomodeset boot hang),
#   storage/filesystem built-ins (already present: virtio, ext4).
#
# parentconfig is molecule (the systemd-free base): distro.yaml is NOT in
# this chain on purpose — this edition must not inherit systemd, dracut or
# GRUB configuration.
#
# STATUS: phase 1 boot core works end-to-end (tested from GRUB: immediate
# default kexec, console menu fallback). Phases 2/3 (GTK4 + libadwaita +
# cage/seatd/wlroots kiosk + splash-boot-manager) are packaged in this file;
# the packages need to be repacked to syspkg from the updated BuildScripts +
# SourceStream definitions before this edition builds end-to-end with the
# graphical UI.
# ---------------------------------------------------------------------------

parentconfig: molecule

packages:
    # ---- phase 1: non-graphic boot core -----------------------------------
    # udev without systemd (LFS' udev comes from systemd's source tree)
    # NOTE: eudev BuildScripts package still missing — added when packaged.
    # - package: "eudev"
    #   version: "3.2.14"
    - package: "kexec_tools"
      version: "2.0.29"
    - package: "efivar"
      version: "39"
    - package: "popt"
      version: "1.19"
    - package: "efibootmgr"
      version: "18"
    - package: "smartmontools"
      version: "7.5"

    # ---- phase 2: GTK4 + libadwaita stack ----------------------------------
    # Dependency order is expressed in the build list below.
    - package: "libpng"
      version: "1.6.47"
    - package: "glib"
      version: "2.84.4"
    - package: "libxml2"
      version: "2.13.6"
    - package: "freetype"
      version: "2.13.3"
    - package: "fribidi"
      version: "1.0.16"
    - package: "harfbuzz"
      version: "10.4.0"
    - package: "fontconfig"
      version: "2.15.0"
    - package: "pixman"
      version: "0.44.2"
    - package: "cairo"
      version: "1.18.4"
    - package: "graphene"
      version: "1.10.8"
    - package: "gdk_pixbuf"
      version: "2.42.12"
    - package: "pango"
      version: "1.56.3"
    - package: "libdrm"
      version: "2.4.125"
    - package: "wayland"
      version: "1.23.1"
    - package: "wayland_protocols"
      version: "1.41"
    - package: "libxkbcommon"
      version: "1.8.1"
    - package: "xkeyboard_config"
      version: "2.44"

    # gtk4 requires epoxy, libjpeg and libtiff unconditionally (no
    # required: false on those dependency() calls). jpeg 9f and tiff 4.4.0
    # are the last non-cmake releases - the chroot has no cmake. libepoxy
    # only vendors the Khronos registry XML (for codegen), not the compile
    # headers: EGL/eglplatform.h comes from mesa's egl.pc, so mako + mesa
    # build before it (mesa's codegen also needs the mako python module).
    - package: "jpeg"
      version: "9f"
    - package: "tiff"
      version: "4.4.0"
    - package: "mako"
      version: "1.3.9"
    - package: "mesa"
      version: "24.3.4"
    - package: "libepoxy"
      version: "1.5.10"

    - package: "gtk4"
      version: "4.16.12"
    - package: "libadwaita"
      version: "1.5.6"

    # ---- phase 3: kiosk session + custom app -------------------------------
    - package: "libevdev"
      version: "1.13.4"
    - package: "mtdev"
      version: "1.1.7"
    - package: "eudev"
      version: "3.2.14"
    - package: "libinput"
      version: "1.27.1"
    - package: "seatd"
      version: "0.9.1"
    - package: "libliftoff"
      version: "0.5.0"
    - package: "wlroots"
      version: "0.17.4"
    - package: "cage"
      version: "0.2.0"
    - package: "splash_boot_manager"
      version: "0.1.0"

    # ---- toolchain: rust for splash-boot-manager (phase 3, Rust/GTK4) -----
    # Bootstrap install of pre-built rustc/cargo binaries (no compilation).
    - package: "rust"
      version: "1.100.0"

    # ---- phase 2: GTK4 + libadwaita stack (packaged - see BuildScripts) ----
    # glib, pango, cairo, harfbuzz, fribidi, gdk_pixbuf, graphene,
    # fontconfig, freetype, libxml2, wayland, wayland_protocols, libxkbcommon
    # (+ xkeyboard_config data, libpng)

    # ---- phase 3: kiosk session + custom app (packaged) ---------------------
    # mesa (softpipe software GL - no LLVM), libevdev, mtdev, eudev (libudev
    # for libinput), libinput, seatd, libliftoff, wlroots, cage,
    # splash_boot-manager (SplashBootManager repo, vendored crates)

build:
    # Phase 1: tools that need the chroot toolchain only. Built AFTER the
    # molecule base, inside the chroot. The rust toolchain installs first
    # (bootstrap binaries, no compilation) so phase 3 can build the UI.
    - task: change_enviroment
      enviroment: chroot
      build:
        - task: compile
          package: rust
          buildmode: 1

        - task: compile
          package: kexec_tools
          buildmode: 1

        - task: compile
          package: efivar
          buildmode: 1

        - task: compile
          package: popt
          buildmode: 1

        - task: compile
          package: efibootmgr
          buildmode: 1

        - task: compile
          package: smartmontools
          buildmode: 1

        # superkey - evdev probe for "is a Super (Windows) key held?". Used
        # by /sbin/init at power-on: Super held -> boot options menu,
        # Super not held -> kexec the default BLS entry immediately. Reads
        # the current key state (EVIOCGKEY), not the event stream, so it
        # works no matter when the key was pressed. EVIOCGKEY is an ioctl,
        # which bash cannot do, hence this tiny helper. Kernel input
        # headers come from the linux-headers build (buildmode 1).
        # Paths are $splash_partition_root-prefixed so the same task text
        # also works host-side (SplashBootManager/install-test-entries.sh
        # evals it to reinstall boot tools without a rebuild).
        - task: custom
          commands:
           - |
            echo "Building the superkey boot probe..."
            mkdir -p "$splash_partition_root/usr/src"
            cat > "$splash_partition_root/usr/src/superkey.c" << "EOF"
            /* superkey - exit 0 when a Super (Windows) key is currently held,
             * exit 1 when it is not (or no input devices exist). */
            #include <dirent.h>
            #include <fcntl.h>
            #include <limits.h>
            #include <stdio.h>
            #include <string.h>
            #include <sys/ioctl.h>
            #include <unistd.h>
            #include <linux/input.h>
            #include <linux/input-event-codes.h>

            int main(void)
            {
                DIR *dir = opendir("/dev/input");
                if (!dir) {
                    perror("superkey: /dev/input");
                    return 1;
                }

                struct dirent *d;
                while ((d = readdir(dir)) != NULL) {
                    if (strncmp(d->d_name, "event", 5) != 0)
                        continue;

                    char path[PATH_MAX];
                    snprintf(path, sizeof(path), "/dev/input/%s", d->d_name);

                    int fd = open(path, O_RDONLY | O_NONBLOCK);
                    if (fd < 0)
                        continue;

                    unsigned char keybits[(KEY_MAX / 8) + 1] = { 0 };
                    if (ioctl(fd, EVIOCGKEY(sizeof(keybits)), keybits) >= 0) {
                        int left = keybits[KEY_LEFTMETA / 8] & (1 << (KEY_LEFTMETA % 8));
                        int right = keybits[KEY_RIGHTMETA / 8] & (1 << (KEY_RIGHTMETA % 8));
                        if (left || right) {
                            printf("superkey: %s: Super key held\n", path);
                            close(fd);
                            closedir(dir);
                            return 0;
                        }
                    }
                    close(fd);
                }
                closedir(dir);
                return 1;
            }
            EOF
            gcc -O2 -I"$splash_partition_root/usr/include" -o "$splash_partition_root/usr/bin/superkey" "$splash_partition_root/usr/src/superkey.c"
            rm -f "$splash_partition_root/usr/src/superkey.c"
            ls -v -l "$splash_partition_root/usr/bin/superkey"

        # ---- phase 2: GTK4 + libadwaita stack --------------------------------
        # Dependency order. Everything builds in the chroot with the target
        # toolchain; pkg-config resolves the stack incrementally.
        - task: compile
          package: libpng
          buildmode: 1

        - task: compile
          package: glib
          buildmode: 1

        - task: compile
          package: libxml2
          buildmode: 1

        - task: compile
          package: freetype
          buildmode: 1

        - task: compile
          package: fribidi
          buildmode: 1

        - task: compile
          package: harfbuzz
          buildmode: 1

        - task: compile
          package: fontconfig
          buildmode: 1

        - task: compile
          package: pixman
          buildmode: 1

        - task: compile
          package: cairo
          buildmode: 1

        - task: compile
          package: graphene
          buildmode: 1

        - task: compile
          package: gdk_pixbuf
          buildmode: 1

        - task: compile
          package: pango
          buildmode: 1

        - task: compile
          package: libdrm
          buildmode: 1

        - task: compile
          package: wayland
          buildmode: 1

        - task: compile
          package: wayland_protocols
          buildmode: 1

        - task: compile
          package: libxkbcommon
          buildmode: 1

        - task: compile
          package: xkeyboard_config
          buildmode: 1

        # gtk4 requires epoxy, libjpeg and libtiff unconditionally (no
        # required:false on those dependency() calls); jpeg/tiff are the
        # non-cmake releases (the chroot has no cmake). libepoxy only
        # vendors the Khronos registry XML, not the compile headers:
        # EGL/eglplatform.h comes from mesa's egl.pc, so mako + mesa
        # build before it (mesa's codegen also needs the mako module).
        - task: compile
          package: jpeg
          buildmode: 1

        - task: compile
          package: tiff
          buildmode: 1

        # mesa uses the LLVM-free softpipe driver for software GL.
        - task: compile
          package: mako
          buildmode: 1

        - task: compile
          package: mesa
          buildmode: 1

        - task: compile
          package: libepoxy
          buildmode: 1

        - task: compile
          package: gtk4
          buildmode: 1

        - task: compile
          package: libadwaita
          buildmode: 1

        # ---- phase 3: kiosk session + graphical boot manager ------------------
        - task: compile
          package: mako
          buildmode: 1

        - task: compile
          package: mesa
          buildmode: 1

        - task: compile
          package: libevdev
          buildmode: 1

        - task: compile
          package: mtdev
          buildmode: 1

        - task: compile
          package: eudev
          buildmode: 1

        - task: compile
          package: libinput
          buildmode: 1

        - task: compile
          package: seatd
          buildmode: 1

        - task: compile
          package: libliftoff
          buildmode: 1

        - task: compile
          package: wlroots
          buildmode: 1

        - task: compile
          package: cage
          buildmode: 1

        - task: compile
          package: splash_boot_manager
          buildmode: 1

    # Phase 1 host-side: dev boot core for the boot manager itself. The
    # kernel boots root=<this partition> ro; no initramfs, no GRUB on the
    # target (the manager IS the menu).
    #
    # Boot flow:
    #   1. mount the virtual filesystems (devtmpfs is auto-mounted by the
    #      kernel, CONFIG_DEVTMPFS_MOUNT)
    #   2. scan /loader/entries/*.conf + loader.conf (BLS type 1)
    #   3. probe the Super key with /usr/bin/superkey (EVIOCGKEY state, no
    #      timing race):
    #        - Super NOT held: kexec the default entry IMMEDIATELY - no
    #          countdown, the graphical stack never starts
    #        - Super held: open the boot options menu. The graphical UI
    #          (splash-boot-manager under cage via seatd) when the graphical
    #          stack is packaged (phase 3), a console fallback menu until
    #          then. splash-boot-manager is launched with --menu: no
    #          countdown, the entries list only - the user picks, kexec runs.
    # The packaged manager eventually replaces this init entirely.
    #
    # Entry DATA (loader/entries/*.conf for the OSes installed on a specific
    # machine) is machine-specific and is NOT written here - it is installed
    # after the build by SplashBootManager/install-test-entries.sh.
    - task: custom
      commands:
       - |
        echo "Phase 1 boot core: installing dev init..."
        install -v -m755 -d "$splash_partition_root/sbin"
        cat > "$splash_partition_root/sbin/init" << "EOF"
        #!/bin/bash
        # splash-boot-manager: phase 1 dev init (placeholder).
        # See the bootloader edition config for the boot flow; the packaged
        # graphical manager replaces this file.
        mount -t proc proc /proc 2>/dev/null
        mount -t sysfs sysfs /sys 2>/dev/null
        mountpoint -q /dev || mount -t devtmpfs devtmpfs /dev 2>/dev/null

        echo
        echo "  Splash Boot Manager (dev init)"
        echo

        # ---- BLS boot tree ------------------------------------------------
        shopt -s nullglob
        entries=(/loader/entries/*.conf)
        shopt -u nullglob
        if [ ${#entries[@]} -eq 0 ]; then
            echo "  No BLS entries under /loader/entries, dropping to a rescue shell."
            exec /bin/bash
        fi

        # loader.conf: default entry id (BLS glob-style, trailing * allowed)
        # and menu timeout in seconds (only used by the graphical UI).
        default=""
        timeout=5
        if [ -r /loader/loader.conf ]; then
            while read -r key value; do
                case "$key" in
                    default) default="${value%\*}" ;;
                    timeout) timeout="$value" ;;
                esac
            done < /loader/loader.conf
        fi

        # BLS type 1: "key value" per line (matches src/bls.rs; only the
        # first initrd is used by this placeholder).
        parse_entry() {
            entry_title=""
            entry_kernel=""
            entry_initrd=""
            entry_options=""
            while read -r key value; do
                case "$key" in
                    title)   entry_title="$value" ;;
                    linux)   entry_kernel="$value" ;;
                    initrd)  entry_initrd="$value" ;;
                    options) entry_options="$entry_options $value" ;;
                esac
            done < "$1"
        }

        kexec_entry() {
            parse_entry "$1"
            local id cmdline kexec_args
            id="$(basename "$1" .conf)"
            cmdline="${entry_options# }"
            echo "  Booting \"${entry_title:-$id}\" ($id)"
            echo "    kernel:   $entry_kernel"
            [ -n "$entry_initrd" ] && echo "    initrd:   $entry_initrd"
            [ -n "$cmdline" ] && echo "    cmdline:  $cmdline"
            kexec_args=(kexec -l "$entry_kernel" --command-line="$cmdline")
            [ -n "$entry_initrd" ] && kexec_args+=(--initrd="$entry_initrd")
            if ! "${kexec_args[@]}"; then
                echo "  kexec -l failed."
                return 1
            fi
            kexec -e
            echo "  kexec failed, dropping to a rescue shell."
            return 1
        }

        # Default entry pick: exact id first, then id prefix (mirrors
        # src/bls.rs default_entry), otherwise the first entry.
        pick_default() {
            local pass e id
            for pass in exact prefix; do
                for e in "${entries[@]}"; do
                    id="$(basename "$e" .conf)"
                    if [ "$pass" = exact ] && [ "$id" = "$default" ]; then
                        printf '%s' "$e"
                        return 0
                    elif [ "$pass" = prefix ]; then
                        case "$id" in
                            "$default"*) printf '%s' "$e"; return 0 ;;
                        esac
                    fi
                done
            done
            printf '%s' "${entries[0]}"
        }

        # ---- boot options menu (Super key was held) ------------------------
        if [ -x /usr/bin/superkey ] && /usr/bin/superkey >/dev/null 2>&1; then
            echo "  Super key held - boot options"
            echo

            # Graphical UI when the phase-3 stack is packaged: seatd session
            # -> cage (kiosk Wayland) -> splash-boot-manager --menu (no
            # countdown, entries list only). Falls back to the console menu
            # below while the graphical stack is not built yet / on failure.
            if [ -x /usr/bin/splash-boot-manager ] && [ -x /usr/bin/cage ] \
               && [ -x /usr/sbin/seatd ]; then
                echo "  Starting the graphical boot options UI..."
                mkdir -p /run
                export XDG_RUNTIME_DIR=/run
                export WAYLAND_DISPLAY=wayland-0
                export GSK_RENDERER=cairo
                export GSETTINGS_BACKEND=memory
                # libinput enumerates input devices through the udev
                # database: run eudev's udevd before the compositor.
                if [ -x /usr/lib/udev/udevd ]; then
                    /usr/lib/udev/udevd --daemon
                    udevadm trigger --action=add --type=devices 2>/dev/null
                    udevadm settle 2>/dev/null || true
                fi
                seatd -g root >/dev/null 2>&1 &
                seatd_pid=$!
                sleep 1
                cage -d -- /usr/bin/splash-boot-manager --menu
                echo "  Graphical UI exited (status $?) , falling back to the console menu."
                echo
                kill -TERM "$seatd_pid" 2>/dev/null
            fi

            echo "  Boot options:"
            echo
            local_menu=()
            for e in "${entries[@]}"; do
                parse_entry "$e"
                local_menu+=("$e")
            done
            n=0
            for e in "${local_menu[@]}"; do
                n=$((n+1))
                parse_entry "$e"
                printf "  [%d] %s\n" "$n" "${entry_title:-$(basename "$e" .conf)}"
            done
            echo
            printf "  Boot entry number [1-%d]: " "$n"
            if read -r choice && [ "$choice" -ge 1 ] 2>/dev/null \
               && [ "$choice" -le "$n" ] 2>/dev/null; then
                :
            else
                choice=1
            fi
            kexec_entry "${local_menu[$((choice-1))]}"
            echo
            exec /bin/bash
        fi

        # ---- default boot: IMMEDIATELY, no timeout -------------------------
        entry="$(pick_default)"
        id="$(basename "$entry" .conf)"
        echo "  Booting the default entry \"$id\" (hold Super at power-on for boot options)"
        echo
        # Splash logo on the framebuffer: hides the text console and keeps
        # the logo until kexec replaces the screen. Static asset (nframes 1);
        # the animated GIF plays in the graphical UI and later plymouth.
        if [ -x /usr/bin/splash-logo ] \
           && [ -r /usr/share/splashos/boot-logo.raw ]; then
            /usr/bin/splash-logo || true
        fi
        kexec_entry "$entry"
        echo
        exec /bin/bash
        EOF
        chmod -v 755 "$splash_partition_root/sbin/init"
        # Distinguish the boot-manager install from a regular molecule system
        sed -i 's/^VARIANT=.*/VARIANT="Splash Boot Manager"/; s/^VARIANT_ID=.*/VARIANT_ID="boot-manager"/' "$splash_partition_root/etc/os-release"
