        - task: custom
          commands:
           - |
            # ---- system services ---------------------------------------------
            systemctl enable NetworkManager.service
            systemctl enable bluetooth.service
            systemctl enable upower.service
            systemctl enable accounts-daemon.service
            # wpa_supplicant/colord/geoclue/polkit are D-Bus activated.

            # The OS root is immutable (/etc is a volatile overlay): keep
            # Wi-Fi/VPN profiles on the persistent /var instead.
            install -dv -m755 /etc/NetworkManager/conf.d
            cat > /etc/NetworkManager/conf.d/10-splashos-persistent.conf << "EOF"
            [keyfile]
            path=/var/lib/NetworkManager/system-connections
            EOF

            # ---- per-user services (all users) --------------------------------
            # PipeWire is the only sound server (pipewire-pulse speaks the
            # PulseAudio protocol for libpulse clients).
            systemctl --global enable pipewire.socket pipewire-pulse.socket wireplumber.service
            systemctl --global enable gcr-ssh-agent.socket || true

            # ---- caches for the read-only image -------------------------------
            # Everything below is normally refreshed by package-manager
            # hooks; the image is immutable, so do it once at build time.
            glib-compile-schemas /usr/share/glib-2.0/schemas
            gtk-update-icon-cache -qtf /usr/share/icons/hicolor || true
            gtk-update-icon-cache -qtf /usr/share/icons/Adwaita || true
            gtk-query-immodules-3.0 --update-cache || true
            gdk-pixbuf-query-loaders --update-cache || true
            gio-querymodules /usr/lib/gio/modules || true
            update-desktop-database /usr/share/applications || true
            update-mime-database /usr/share/mime || true
            fc-cache -f || true
            ldconfig

            # ---- GNOME login -------------------------------------------------
            install -dv -m755 /etc/gdm
            cat > /etc/gdm/custom.conf << "EOF"
            [daemon]
            AutomaticLoginEnable=True
            AutomaticLogin=splash
            WaylandEnable=true

            [security]

            [xdmcp]

            [chooser]

            [debug]
            EOF

            systemctl enable gdm.service
            systemctl set-default graphical.target
