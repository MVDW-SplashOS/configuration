# ---------------------------------------------------------------------------
# SplashOS "desktop-gnome" edition layer  (temporary session)
#
# GNOME 47 is the desktop session for now; it will be replaced later. It is
# a layer of its own so replacing it never touches the immutable / Flatpak
# / AppImage policy (desktop-base.yml) or the image configuration
# (desktop.yml).
#
# Chain: molecule -> distro -> desktop-base -> desktop-gnome -> desktop
# To swap the session later: add desktop-<session>.yml with
# `parentconfig: desktop-base` and point desktop.yml's parentconfig at it.
#
# What this layer builds: GNOME Shell on Mutter (Wayland + Xwayland), GDM,
# gnome-settings-daemon, gnome-session, PipeWire audio, NetworkManager,
# ModemManager, BlueZ, udisks2, printing (CUPS, Avahi, cups-filters,
# Ghostscript, Gutenprint, HPLIP, brlaser, Samba client), the
# GNOME portals, Settings, Files (Nautilus), Console and GNOME Software
# (the Flatpak store). The task list is in dependency order.
#
# buildmode 2 entries rebuild packages that the bootloader edition builds
# without GObject-Introspection/X11 (glib, gdk-pixbuf in desktop-base;
# harfbuzz, cairo, gobject-introspection, graphene, pango, libxkbcommon,
# mesa, libepoxy, gtk4 here) and systemd with PAM.
#
# NOT built yet (follow-up):
#   - further vendor drivers (splix, foo2zjs, Epson ESC/P-R, ...) and the
#     HPLIP Python tools (hp-setup, scanning, fax).
#   - gnome-initial-setup: the image ships a preconfigured user instead.
#   - localsearch (file indexer), Xorg session (Wayland only),
#     gnome-terminal (replaced by GNOME Console).
# ---------------------------------------------------------------------------

