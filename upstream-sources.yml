# splash_boot_manager has no upstream tarball: its GitHub Action packages
# the sources WITH the vendored crates into a pre-release asset, which
# SourceStream repacks using the BuildScripts manifest/build script like
# every other package. Bumping the Cargo.toml version + running the action
# publishes the new release.
